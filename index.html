<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杰冠产品学习考试系统</title>
    <script src="data/images-data.js" onerror=""></script>
    <script src="data/image-file-map.js" onerror=""></script>
    <script src="lib/jszip.min.js" onerror=""></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background: #1a2332;
            display: flex;
            align-items: center;
            padding: 0 24px;
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-logo {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            margin-right: 40px;
            white-space: nowrap;
        }

        .navbar-links {
            display: flex;
            gap: 4px;
            flex: 1;
        }

        .navbar-links a {
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 14px;
            transition: color 0.2s, background 0.2s;
            cursor: pointer;
            user-select: none;
        }

        .navbar-links a:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .navbar-links a.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
        }

        .navbar-admin {
            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;
            cursor: pointer;
            padding: 4px 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            background: none;
            transition: color 0.2s, border-color 0.2s;
            user-select: none;
        }

        .navbar-admin:hover {
            color: rgba(255, 255, 255, 0.75);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Pages */
        .page {
            display: none;
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page.active {
            display: block;
        }

        .page-title {
            font-size: 22px;
            font-weight: 600;
            color: #1a2332;
            margin-bottom: 16px;
        }

        .page-placeholder {
            background: #fff;
            border-radius: 8px;
            padding: 48px;
            text-align: center;
            color: #999;
            font-size: 15px;
            border: 1px dashed #e0e0e0;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 0 12px;
            }

            .navbar-logo {
                margin-right: 16px;
                font-size: 16px;
            }

            .navbar-links a {
                padding: 6px 10px;
                font-size: 13px;
            }
            .question-area {
                flex-direction: column;
            }
            .option-grid {
                grid-template-columns: 1fr;
            }
            .modal {
                width: 95%;
                margin: 0 10px;
            }
            .admin-table {
                font-size: 12px;
            }
            .admin-table th,
            .admin-table td {
                padding: 6px 8px;
            }
        }

        /* Filter bar */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: all .2s;
            color: #555;
        }
        .filter-btn:hover {
            border-color: #1a73e8;
            color: #1a73e8;
        }
        .filter-btn.active {
            background: #1a73e8;
            color: #fff;
            border-color: #1a73e8;
        }

        /* Product grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            transition: transform .2s, box-shadow .2s;
        }
        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,.12);
        }
        .product-card .card-img {
            width: 100%;
            height: 300px;
            object-fit: contain;
            background: #f8f9fa;
            padding: 16px;
        }
        .product-card .card-body {
            padding: 16px;
        }
        .product-card .card-model {
            font-size: 16px;
            font-weight: 700;
            color: #1a2332;
            margin-bottom: 4px;
        }
        .product-card .card-name {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
        }
        .product-card .card-params {
            font-size: 12px;
            color: #555;
            line-height: 1.8;
            border-top: 1px solid #f0f0f0;
            padding-top: 12px;
        }
        .product-card .card-params .label {
            color: #999;
            font-size: 11px;
            margin-bottom: 4px;
        }
        .product-card .card-func {
            font-size: 12px;
            color: #1a73e8;
            margin-top: 10px;
            line-height: 1.6;
        }
        /* Image lightbox */
        .lightbox-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        .lightbox-overlay.active {
            display: flex;
        }
        .lightbox-overlay img {
            max-width: 92vw;
            max-height: 92vh;
            object-fit: contain;
            border-radius: 8px;
            background: #fff;
            padding: 8px;
        }
        .lightbox-close {
            position: absolute;
            top: 16px;
            right: 24px;
            color: #fff;
            font-size: 36px;
            cursor: pointer;
            line-height: 1;
            z-index: 10000;
        }
        .product-card .card-img {
            cursor: zoom-in;
        }

        .no-image {
            width: 100%;
            height: 220px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #bbb;
            font-size: 14px;
        }

        /* Practice mode */
        .practice-setup {
            text-align: center;
            padding: 40px;
        }
        .practice-setup select {
            padding: 10px 20px;
            font-size: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-right: 12px;
        }
        .practice-setup .start-btn {
            padding: 10px 30px;
            font-size: 15px;
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .practice-setup .start-btn:hover {
            background: #1557b0;
        }
        .question-area {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            padding: 20px 0;
        }
        .question-left {
            flex: 1;
            text-align: center;
        }
        .question-left img {
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 8px;
            background: #f8f9fa;
            padding: 16px;
        }
        .question-left .model-display {
            font-size: 28px;
            font-weight: 700;
            color: #1a2332;
            padding: 40px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        .question-right {
            flex: 1;
        }
        .option-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .option-item {
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all .2s;
            background: #fff;
        }
        .option-item:hover {
            border-color: #1a73e8;
            background: #f0f7ff;
        }
        .option-item img {
            max-width: 100%;
            max-height: 250px;
            object-fit: contain;
            margin-bottom: 8px;
        }
        .option-item .opt-text {
            font-size: 15px;
            font-weight: 600;
        }
        .option-item.correct {
            border-color: #4caf50;
            background: #e8f5e9;
        }
        .option-item.wrong {
            border-color: #f44336;
            background: #ffebee;
        }
        .practice-controls {
            text-align: center;
            margin-top: 24px;
        }
        .practice-controls .next-btn {
            padding: 12px 40px;
            font-size: 15px;
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .next-btn-float {
            position: fixed;
            top: 80px;
            right: 24px;
            z-index: 100;
            padding: 12px 32px;
            font-size: 15px;
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .practice-score {
            font-size: 14px;
            color: #666;
            margin-bottom: 16px;
        }

        /* Exam mode */
        .exam-setup {
            text-align: center;
            padding: 40px;
        }
        .exam-setup .start-btn {
            padding: 12px 40px;
            font-size: 16px;
            background: #e65100;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .exam-setup .start-btn:hover {
            background: #bf360c;
        }
        .exam-progress {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .exam-progress .progress-text {
            font-size: 14px;
            color: #666;
        }
        .exam-nav {
            display: flex;
            justify-content: flex-end;
            margin-top: 24px;
        }
        .exam-nav .submit-btn {
            padding: 12px 40px;
            font-size: 15px;
            background: #e65100;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .exam-nav .submit-btn:hover {
            background: #bf360c;
        }
        .exam-result {
            text-align: center;
            padding: 40px;
        }
        .exam-result .score-big {
            font-size: 64px;
            font-weight: 800;
            color: #e65100;
        }
        .exam-result .score-label {
            font-size: 16px;
            color: #666;
            margin-bottom: 24px;
        }
        .exam-review {
            margin-top: 30px;
            text-align: left;
        }
        .exam-review h3 {
            margin-bottom: 16px;
        }
        .exam-review .review-item {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .exam-review .review-item.correct {
            border-left: 4px solid #4caf50;
            background: #f9fff9;
        }
        .exam-review .review-item.wrong {
            border-left: 4px solid #f44336;
            background: #fff9f9;
        }
/* Admin panel */
.admin-login {
  text-align: center;
  padding: 60px;
}
.admin-login input {
  padding: 12px 20px;
  font-size: 16px;
  border: 1px solid #ddd;
  border-radius: 8px;
  width: 200px;
  margin-right: 12px;
}
.admin-login button {
  padding: 12px 30px;
  font-size: 15px;
  background: #1a2332;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
.admin-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.admin-toolbar .add-btn {
  padding: 10px 24px;
  background: #4caf50;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}
.admin-toolbar .reset-btn {
  padding: 10px 16px;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}
.admin-table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}
.admin-table th {
  background: #1a2332;
  color: #fff;
  padding: 12px;
  text-align: left;
  font-size: 13px;
  white-space: nowrap;
}
.admin-table td {
  padding: 10px 12px;
  border-bottom: 1px solid #f0f0f0;
  font-size: 13px;
  vertical-align: middle;
}
.admin-table tr:hover {
  background: #f8f9fa;
}
.admin-table .btn-edit {
  padding: 4px 12px;
  background: #e3f2fd;
  color: #1a73e8;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  margin-right: 4px;
}
.admin-table .btn-delete {
  padding: 4px 12px;
  background: #ffebee;
  color: #f44336;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
}
/* Modal */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,.5);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal {
  background: #fff;
  border-radius: 12px;
  padding: 30px;
  width: 600px;
  max-height: 80vh;
  overflow-y: auto;
}
.modal h3 {
  margin-bottom: 20px;
}
.modal label {
  display: block;
  font-size: 13px;
  color: #666;
  margin-bottom: 4px;
  margin-top: 12px;
}
.modal input,
.modal select,
.modal textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 14px;
  font-family: inherit;
}
.modal textarea {
  height: 80px;
  resize: vertical;
}
.modal .modal-actions {
  margin-top: 24px;
  display: flex;
  gap: 12px;
  justify-content: flex-end;
}
.modal .btn-save {
  padding: 10px 24px;
  background: #4caf50;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}
.modal .btn-cancel {
  padding: 10px 24px;
  background: #f5f5f5;
  color: #666;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}
.ai-generate-btn {
  padding: 6px 16px;
  background: #ff9800;
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  margin-top: 4px;
}

        // IndexedDB storage for large data (images)
        var DB_NAME = 'JieguanProductDB';
        var DB_VER = 1;
        var STORE = 'products';
        var _cachedProducts = null;

        function _idbOpen(cb) {
          var req = indexedDB.open(DB_NAME, DB_VER);
          req.onupgradeneeded = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
          };
          req.onsuccess = function(e) { cb(null, e.target.result); };
          req.onerror = function(e) { cb(e.target.error); };
        }

        function _idbSave(key, val, cb) {
          _idbOpen(function(err, db) {
            if (err) return cb && cb(err);
            var tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).put(val, key);
            tx.oncomplete = function() { cb && cb(null); };
            tx.onerror = function() { cb && cb(tx.error); };
          });
        }

        function _idbLoad(key, cb) {
          _idbOpen(function(err, db) {
            if (err) return cb(err);
            var tx = db.transaction(STORE, 'readonly');
            var req = tx.objectStore(STORE).get(key);
            req.onsuccess = function() { cb(null, req.result); };
            req.onerror = function() { cb(req.error); };
          });
        }

        // Compress image to reduce storage size
        function compressImage(dataUrl, maxSize, quality) {
          return new Promise(function(resolve) {
            var img = new Image();
            img.onload = function() {
              var w = img.width, h = img.height;
              if (w > maxSize || h > maxSize) {
                if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
                else { w = Math.round(w * maxSize / h); h = maxSize; }
              }
              var canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = function() { resolve(dataUrl); };
            img.src = dataUrl;
          });
        }

        function getProducts() {
            if (_cachedProducts) return _cachedProducts;
            var custom = JSON.parse(localStorage.getItem('products') || 'null');
            var products = custom ? custom : JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
            // Merge batch-imported images
            if (typeof IMAGE_DATA !== 'undefined') {
                for (var i = 0; i < products.length; i++) {
                    if (!getProductImage(products[i]) && IMAGE_DATA[products[i].model]) {
                        products[i].image = IMAGE_DATA[products[i].model];
                    }
                }
            }
            _cachedProducts = products;
            return products;
        }

        function saveProducts(products) {
            _cachedProducts = products;
            // Save to IndexedDB (handles large image data)
            _idbSave('products', products, function(err) {
              if (err) console.warn('[存储] IndexedDB保存失败:', err);
            });
            // Also save to localStorage without images as fallback
            try {
              var lite = products.map(function(p) {
                var copy = Object.assign({}, p);
                if (copy.image && copy.image.length > 1000) copy.image = '';
                if (copy.images) copy.images = copy.images.map(function(img) { return img && img.length > 1000 ? '' : img; });
                return copy;
              });
              localStorage.setItem('products', JSON.stringify(lite));
            } catch(e) {
              console.warn('[存储] localStorage保存失败:', e.message);
            }
        }

        function resetProducts() {
            _cachedProducts = null;
            localStorage.removeItem('products');
            _idbOpen(function(err, db) {
              if (!err) {
                var tx = db.transaction(STORE, 'readwrite');
                tx.objectStore(STORE).clear();
              }
            });
        }

        function getProductImage(product) {
            if (product.images && product.images.length > 0 && product.images[0]) return product.images[0];
            if (product.image) return product.image;
            // Fallback 1: images named by model (e.g. images/A001.jpg)
            if (product.model) return 'images/' + product.model + '.jpg';
            return '';
        }

        function getReportedQuestions() {
            return JSON.parse(localStorage.getItem('reportedQuestions') || '[]');
        }

        function reportQuestion(productId, type) {
            var reported = getReportedQuestions();
            var key = productId + '|' + type;
            if (reported.indexOf(key) === -1) {
                reported.push(key);
                localStorage.setItem('reportedQuestions', JSON.stringify(reported));
            }
            // Check if in exam mode or practice mode
            if (examState.questions.length > 0 && !examState.finished) {
                // Exam mode: skip to next question
                examState.current++;
                showExamQuestion();
            } else if (practiceState.questions.length > 0) {
                // Practice mode: next question
                nextPracticeQuestion();
            }
        }

        function isQuestionReported(productId, type) {
            var reported = getReportedQuestions();
            return reported.indexOf(productId + '|' + type) !== -1;
        }

        function addProduct(product) {
            var products = getProducts();
            product.id = 'p' + Date.now();
            products.push(product);
            saveProducts(products);
            return product;
        }

        function updateProduct(id, data) {
            var products = getProducts();
            var idx = -1;
            for (var i = 0; i < products.length; i++) {
                if (products[i].id === id) { idx = i; break; }
            }
            if (idx !== -1) {
                for (var key in data) {
                    if (data.hasOwnProperty(key)) {
                        products[idx][key] = data[key];
                    }
                }
                saveProducts(products);
            }
        }

        function deleteProduct(id) {
            var products = getProducts().filter(function(p) { return p.id !== id; });
            saveProducts(products);
        }

function startPractice() {
  var series = document.getElementById('practiceSeries').value;
  var allProducts = getProducts();
  var products = [];
  for (var i = 0; i < allProducts.length; i++) {
    if (series === 'all' || allProducts[i].series === series) {
      products.push(allProducts[i]);
    }
  }
  if (products.length < 2) {
    alert('该系列下产品不足2个，无法出题');
    return;
  }
  practiceState = {
    series: series,
    questions: generateQuestions(products),
    current: 0,
    correct: 0,
    total: 0
  };
  showPracticeQuestion();
}

function generateQuestions(products) {
  var questions = [];
  for (var i = 0; i < products.length; i++) {
    var p = products[i];
    questions.push({ type: 'img-to-model', product: p, options: pickDistractors(p, products, 'model') });
    questions.push({ type: 'model-to-img', product: p, options: pickDistractors(p, products, 'image') });
    // voltage-to-model
    var voltageMatch = (p.parameters || '').match(/(\d+V)/);
    if (voltageMatch) {
      questions.push({ type: 'voltage-to-model', product: p, voltage: voltageMatch[1], options: pickDistractors(p, products, 'model') });
    }
    // name-to-model
    questions.push({ type: 'name-to-model', product: p, options: pickDistractors(p, products, 'model') });
  }
  // Filter out reported questions
  var filtered = [];
  for (var i = 0; i < questions.length; i++) {
    if (!isQuestionReported(questions[i].product.id, questions[i].type)) {
      filtered.push(questions[i]);
    }
  }
  return shuffleArray(filtered);
}

function pickDistractors(correct, pool, field) {
  var others = [];
  for (var i = 0; i < pool.length; i++) {
    if (pool[i].id !== correct.id) others.push(pool[i]);
  }
  var shuffled = shuffleArray(others);
  var distractors = [];
  for (var i = 0; i < Math.min(3, shuffled.length); i++) {
    var val = field === 'image' ? getProductImage(shuffled[i]) : shuffled[i][field];
    distractors.push({ id: shuffled[i].id, value: val, model: shuffled[i].model, image: getProductImage(shuffled[i]) });
  }
  var correctVal = field === 'image' ? getProductImage(correct) : correct[field];
  var answer = { id: correct.id, value: correctVal, model: correct.model, image: getProductImage(correct) };
  return shuffleArray([answer].concat(distractors));
}

function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = a[i];
    a[i] = a[j];
    a[j] = temp;
  }
  return a;
}

function showPracticeQuestion() {
  var el = document.getElementById('practiceContent');
  var q = practiceState.questions[practiceState.current];
  if (!q) { showPracticeResult(); return; }

  var leftContent, rightContent;
  if (q.type === 'img-to-model') {
    var img = getProductImage(q.product);
    if (img) {
      leftContent = '<img src="' + img + '" alt="' + q.product.model + '">';
    } else {
      leftContent = '<div class="no-image" style="height:300px;">暂无图片</div>';
    }
    rightContent = '<div class="option-grid">';
    for (var i = 0; i < q.options.length; i++) {
      rightContent += '<div class="option-item" onclick="checkPracticeAnswer(' + i + ', \'' + q.options[i].id + '\')">';
      rightContent += '<div class="opt-text">' + q.options[i].model + '</div></div>';
    }
    rightContent += '</div>';
  } else if (q.type === 'model-to-img') {
    leftContent = '<div class="model-display">' + q.product.model + '</div>';

function checkPracticeAnswer(optIdx, selectedId) {
  var q = practiceState.questions[practiceState.current];
  var correct = selectedId === q.product.id;
  practiceState.total++;

  var items = document.querySelectorAll('.option-item');
  for (var i = 0; i < items.length; i++) {
    items[i].style.pointerEvents = 'none';
    if (q.options[i].id === q.product.id) {
      items[i].classList.add('correct');
    } else if (i === optIdx && !correct) {
      items[i].classList.add('wrong');
    }
  }

  if (correct) {
    practiceState.correct++;
  } else {
    addWrongAnswer(q);
  }

  document.getElementById('practiceControls').innerHTML =
    '<button class="next-btn" onclick="nextPracticeQuestion()">下一题</button>';
  // 浮动下一题按钮（右上角）
  var floatBtn = document.createElement('button');
  floatBtn.className = 'next-btn-float';
  floatBtn.textContent = '下一题 ▶';
  floatBtn.onclick = function() { nextPracticeQuestion(); this.remove(); };
  document.body.appendChild(floatBtn);
}

function nextPracticeQuestion() {
  var fb = document.querySelector('.next-btn-float');
  if (fb) fb.remove();
  practiceState.current++;
  showPracticeQuestion();
}

function showPracticeResult() {
  var el = document.getElementById('practiceContent');
  var rate = practiceState.total > 0 ? Math.round(practiceState.correct / practiceState.total * 100) : 0;
  el.innerHTML = '<div class="practice-setup">' +
    '<h3>练习结束！</h3>' +
    '<p style="font-size:18px;margin:20px 0;">正确率: ' + rate + '% (' + practiceState.correct + ' / ' + practiceState.total + ')</p>' +
    '<button class="start-btn" onclick="renderPracticeSetup()">返回选择</button>' +
    '</div>';
}

// Wrong answer stub (will be completed in Task 6)
function addWrongAnswer(question) {
  var wrong = JSON.parse(localStorage.getItem('wrongAnswers') || '[]');
  var existing = null;
  for (var i = 0; i < wrong.length; i++) {
    if (wrong[i].productId === question.product.id && wrong[i].type === question.type) {
      existing = wrong[i];
      break;
    }
  }
  if (existing) {
    existing.count++;
  } else {
    wrong.push({
      productId: question.product.id,
      type: question.type,
      product: question.product,
      count: 1
    });
  }
  localStorage.setItem('wrongAnswers', JSON.stringify(wrong));
}

// Exam mode
var examState = { questions: [], current: 0, answers: [], startTime: null, finished: false };
var examTimer = null;
var EXAM_TIME_LIMIT = 15 * 60; // 15分钟（秒）

function renderExamSetup() {
  var el = document.getElementById('examContent');
  var products = getProducts();
  if (products.length < 2) {
    el.innerHTML = '<div style="text-align:center;color:#999;padding:60px;">产品不足2个，无法进行考试。请先在后台添加产品。</div>';
    return;
  }
  el.innerHTML = '<div class="exam-setup">' +
    '<p style="margin-bottom:12px;color:#666;">模拟考试将从所有产品中随机抽取题目</p>' +
    '<p style="margin-bottom:20px;color:#999;">50题，每题2分，满分100分 &nbsp;|&nbsp; 限时15分钟</p>' +
    '<button class="start-btn" onclick="startExam()">开始考试</button>' +
    '</div>';
}

function startExam() {
  var products = getProducts();
  if (products.length < 2) {
    alert('产品不足，无法开始考试');
    return;
  }
  var allQuestions = generateQuestions(products);
  examState = {
    questions: shuffleArray(allQuestions).slice(0, 50),
    current: 0,
    answers: [],
    startTime: Date.now(),
    finished: false
  };
  // 启动倒计时
  if (examTimer) clearInterval(examTimer);
  examTimer = setInterval(function() {
    var elapsed = Math.floor((Date.now() - examState.startTime) / 1000);
    var remaining = EXAM_TIME_LIMIT - elapsed;
    var timerEl = document.getElementById('examTimer');
    if (timerEl) {
      if (remaining <= 0) {
        timerEl.textContent = '00:00';
        timerEl.style.color = '#f44336';
        clearInterval(examTimer);
        finishExam();
        return;
      }
      var m = Math.floor(remaining / 60);
      var s = remaining % 60;
      timerEl.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
      if (remaining <= 60) timerEl.style.color = '#f44336';
      else if (remaining <= 180) timerEl.style.color = '#ff9800';
    }
  }, 1000);
  showExamQuestion();
}

  if (!q) { finishExam(); return; }

    leftContent = '<div class="model-display">' + q.product.model + '</div>';

    for (var i = 0; i < q.options.length; i++) {
      rightContent += '<div class="option-item" onclick="selectExamAnswer(' + i + ', \'' + q.options[i].id + '\')">';

        rightContent += '<div class="no-image" style="height:100px;">无图</div>';
      }
      rightContent += '</div>';
    }
    rightContent += '</div>';

function selectExamAnswer(optIdx, selectedId) {
  var q = examState.questions[examState.current];
  var correct = selectedId === q.product.id;
  examState.answers.push({ questionIndex: examState.current, selectedId: selectedId, correct: correct });

  if (!correct) {
    addWrongAnswer(q);
  }

  // Show feedback
  var items = document.querySelectorAll('.option-item');
  for (var i = 0; i < items.length; i++) {
    items[i].style.pointerEvents = 'none';
    if (q.options[i].id === q.product.id) {
      items[i].classList.add('correct');
    } else if (i === optIdx && !correct) {
      items[i].classList.add('wrong');
    }
  }

  // Auto advance after 1 second delay
  setTimeout(function() {
    examState.current++;
    showExamQuestion();
  }, 1000);
}

function finishExam() {
  examState.finished = true;
  if (examTimer) { clearInterval(examTimer); examTimer = null; }
  var correctCount = 0;
  for (var i = 0; i < examState.answers.length; i++) {
    if (examState.answers[i].correct) correctCount++;
  }
  var total = examState.questions.length;
  var maxScore = total * 2;
  var score = correctCount * 2;
  var elapsed = Math.round((Date.now() - examState.startTime) / 1000);
  var mins = Math.floor(elapsed / 60);
  var secs = elapsed % 60;

  // Save score
  saveExamScore(score, total, correctCount);

  // Refresh wrong answers tab
  renderWrongPage();

  var typeLabels = {
    'img-to-model': '看图选型号',
    'model-to-img': '看型号选图片',
    'voltage-to-model': '看电压选型号',
    'name-to-model': '看名称选型号'
  };

  var reviewHtml = '<h3>答题详情</h3>';
  for (var i = 0; i < examState.answers.length; i++) {
    var a = examState.answers[i];
    var q = examState.questions[a.questionIndex];
    var cls = a.correct ? 'correct' : 'wrong';
    var typeLabel = typeLabels[q.type] || q.type;
    var mark = a.correct ? '<span style="color:#4caf50;"> &#10003;</span>' : '<span style="color:#f44336;"> &#215;</span>';
    reviewHtml += '<div class="review-item ' + cls + '"><strong>第' + (i + 1) + '题</strong> &nbsp; ' + typeLabel + ' &nbsp; 正确答案: <strong>' + q.product.model + '</strong>' + mark + '</div>';
  }

  var timeUp = examState.answers.length < examState.questions.length;
  var timeUpMsg = timeUp ? '<div style="color:#f44336;font-weight:bold;margin-bottom:8px;">⏰ 时间到！已自动交卷</div>' : '';

  document.getElementById('examContent').innerHTML =
    '<div class="exam-result">' +
    timeUpMsg +
    '<div class="score-big">' + score + '分</div>' +
    '<div class="score-label">满分' + maxScore + '分 &nbsp;|&nbsp; 用时 ' + mins + '分' + secs + '秒 &nbsp;|&nbsp; 答题 ' + examState.answers.length + '/' + total + '</div>' +
    '<button class="start-btn" onclick="renderExamSetup()" style="background:#1a73e8;">返回</button>' +
    '</div>' +
    '<div class="exam-review">' + reviewHtml + '</div>';
}

function saveExamScore(score, total, correctCount) {
  var scores = getExamScores();
  scores.unshift({
    score: score,
    total: total,
    correctCount: correctCount,
    date: new Date().toLocaleString('zh-CN'),
    questionCount: total
  });
  if (scores.length > 10) scores = scores.slice(0, 10);
  localStorage.setItem('examScores', JSON.stringify(scores));
}

        // CSV import/export
        function importCSV(input) {
          var file = input.files[0];
          if (!file) return;
          console.log('[CSV导入] 文件名:', file.name, '大小:', file.size, '字节');
          var reader = new FileReader();
          reader.onload = function(e) {
            var buf = new Uint8Array(e.target.result);
            var text;

            // Encoding detection: try GBK first (Chinese Excel default), fall back to UTF-8
            var gbkText = new TextDecoder('gbk').decode(buf);
            if (gbkText.indexOf('型号') !== -1 || gbkText.indexOf('产品') !== -1 || gbkText.indexOf('系列') !== -1) {
              text = gbkText;
            } else {
              var offset = 0;
              if (buf[0] === 0xEF && buf[1] === 0xBB && buf[2] === 0xBF) offset = 3;
              text = new TextDecoder('utf-8').decode(buf.slice(offset));
            }

            // Standard CSV parser: handles quoted multi-line fields correctly
            // This is the key fix - don't split by \n first, parse character by character
            function parseCSV(text) {
              var rows = [];
              var row = [];
              var field = '';
              var inQuotes = false;

              for (var i = 0; i < text.length; i++) {
                var ch = text[i];
                var next = text[i + 1];

                if (inQuotes) {
                  if (ch === '"' && next === '"') {
                    field += '"'; // Escaped quote
                    i++;
                  } else if (ch === '"') {
                    inQuotes = false; // End of quoted field
                  } else {
                    field += ch; // Including \n inside quotes (multi-line field)
                  }
                } else {
                  if (ch === '"') {
                    inQuotes = true;
                  } else if (ch === ',') {
                    row.push(field.trim());
                    field = '';
                  } else if (ch === '\n') {
                    row.push(field.trim());
                    field = '';
                    if (row.length > 0) rows.push(row);
                    row = [];
                  } else if (ch === '\r') {
                    // Skip \r
                  } else {
                    field += ch;
                  }
                }
              }
              // Last field/row
              field = field.trim();
              if (field || row.length > 0) {
                row.push(field);
                rows.push(row);
              }
              return rows;
            }

            var allRows = parseCSV(text);
            console.log('[CSV导入] 解析行数:', allRows.length);
            if (allRows.length < 2) { alert('CSV文件格式错误：至少需要表头和一行数据'); return; }

            // Parse header - match by keyword
            var header = allRows[0];
            console.log('[CSV导入] 表头:', JSON.stringify(header));
            var colMap = {};
            for (var i = 0; i < header.length; i++) {
              var h = header[i];
              if (h.indexOf('型号') !== -1) colMap.model = i;
              else if (h.indexOf('名称') !== -1 && h.indexOf('中文') !== -1) colMap.name = i;
              else if (h.indexOf('名称') !== -1 && h.indexOf('英文') !== -1) colMap.nameEn = i;
              else if (h.indexOf('系列') !== -1) colMap.series = i;
              else if (h.indexOf('参数') !== -1 && h.indexOf('中文') !== -1) colMap.params = i;
              else if (h.indexOf('参数') !== -1 && h.indexOf('英文') !== -1) colMap.paramsEn = i;
              else if (h.indexOf('功能') !== -1) colMap.functions = i;
            }
            console.log('[CSV导入] 列映射:', JSON.stringify(colMap));

            if (colMap.model === undefined) {
              alert('CSV格式错误：未找到"型号"列。\n\n表头：\n' + header.map(function(h,i){return (i+1)+'. '+h}).join('\n'));
              return;
            }

            // Build series name→id mapping (supports both Chinese names and IDs)
            var seriesNameToId = {};
            SERIES.forEach(function(s) {
              seriesNameToId[s.id] = s.id;
              seriesNameToId[s.label] = s.id;
              // Also match partial names
              var shortLabel = s.label.replace('系列', '');
              if (!seriesNameToId[shortLabel]) seriesNameToId[shortLabel] = s.id;
            });

            var imported = 0;
            var updated = 0;
            var products = getProducts();

            for (var ri = 1; ri < allRows.length; ri++) {
              var fields = allRows[ri];
              var model = colMap.model !== undefined ? fields[colMap.model] : '';
              if (!model) continue;

              // Resolve series: try direct match, then partial match
              var rawSeries = colMap.series !== undefined ? fields[colMap.series] : '';
              var seriesId = seriesNameToId[rawSeries] || SERIES[0].id;
              // Try partial match if no direct match
              if (!seriesNameToId[rawSeries]) {
                for (var key in seriesNameToId) {
                  if (rawSeries.indexOf(key) !== -1 || key.indexOf(rawSeries) !== -1) {
                    seriesId = seriesNameToId[key];
                    break;
                  }
                }
              }

              // Check if product already exists
              var existing = null;
              for (var pi = 0; pi < products.length; pi++) {
                if (products[pi].model === model) { existing = products[pi]; break; }
              }

              var productData = {
                model: model,
                name: colMap.name !== undefined ? fields[colMap.name] : model,
                nameEn: colMap.nameEn !== undefined ? (fields[colMap.nameEn] || '') : '',
                series: seriesId,
                parameters: colMap.params !== undefined ? (fields[colMap.params] || '') : '',
                parametersEn: colMap.paramsEn !== undefined ? (fields[colMap.paramsEn] || '') : '',
                functions: colMap.functions !== undefined ? (fields[colMap.functions] || '') : '',
                images: existing ? (existing.images || []) : [],
                image: existing ? (existing.image || '') : ''
              };

              if (existing) {
                Object.keys(productData).forEach(function(k) {
                  if (productData[k] || (k !== 'image' && k !== 'images')) {
                    existing[k] = productData[k];
                  }
                });
                updated++;
              } else {
                productData.id = 'p' + Date.now() + '_' + imported;
                products.push(productData);
                imported++;
              }
            }

            saveProducts(products);
            var msg = '导入完成！新增 ' + imported + ' 个，更新 ' + updated + ' 个产品。';
            console.log('[CSV导入]', msg);
            alert(msg);
            renderAdminPanel();
            input.value = '';
          };
          reader.readAsArrayBuffer(file);
        }

        function importXLSX(input) {
          var file = input.files[0];
          if (!file) return;
          alert('正在解析Excel文件，请稍候...');
          var reader = new FileReader();
          reader.onload = async function(e) {
            try {
              var data = new Uint8Array(e.target.result);

              // 1. Read sheet data with xlsx library
              var wb = XLSX.read(data, { type: 'array' });
              var sheet = wb.Sheets[wb.SheetNames[0]];
              var range = XLSX.utils.decode_range(sheet['!ref']);

              // Find column indices from header row
              var colMap = {};
              for (var c = range.s.c; c <= range.e.c; c++) {
                var cell = sheet[XLSX.utils.encode_cell({ r: 0, c: c })];
                if (!cell || !cell.v) continue;
                var h = String(cell.v).trim();
                if (h.indexOf('型号') !== -1) colMap.model = c;
                else if (h.indexOf('名称') !== -1 && h.indexOf('中文') !== -1) colMap.name = c;
                else if (h.indexOf('名称') !== -1 && h.indexOf('英文') !== -1) colMap.nameEn = c;
                else if (h.indexOf('系列') !== -1 && h.indexOf('分类') === -1) colMap.series = c;
                else if (h.indexOf('系列分类') !== -1) colMap.series = c;
                else if (h.indexOf('参数') !== -1 && h.indexOf('中文') !== -1) colMap.params = c;
                else if (h.indexOf('参数') !== -1 && h.indexOf('英文') !== -1) colMap.paramsEn = c;
                else if (h.indexOf('功能') !== -1) colMap.functions = c;
              }
              console.log('[Excel导入] 列映射:', JSON.stringify(colMap));

              if (colMap.model === undefined) {
                alert('Excel格式错误：未找到"型号"列');
                return;
              }

              // Build series mapping
              var seriesNameToId = {};
              SERIES.forEach(function(s) {
                seriesNameToId[s.id] = s.id;
                seriesNameToId[s.label] = s.id;
                var short = s.label.replace('系列', '');
                if (!seriesNameToId[short]) seriesNameToId[short] = s.id;
              });

              // 2. Extract images from xlsx (it's a ZIP file)
              var rowImages = {}; // row -> base64 data URL
              var allMediaImages = []; // all images in order
              try {
                var zip = await JSZip.loadAsync(data);

                // Collect all media files in order
                var mediaFiles = Object.keys(zip.files).filter(function(f) {
                  return f.startsWith('xl/media/') && !zip.files[f].dir;
                }).sort(function(a, b) {
                  var ma = a.match(/image(\d+)/);
                  var mb = b.match(/image(\d+)/);
                  if (!ma || !mb) return a.localeCompare(b);
                  return parseInt(ma[1]) - parseInt(mb[1]);
                });

                // Load all images first (with compression)
                for (var mi = 0; mi < mediaFiles.length; mi++) {
                  var imgBase64 = await zip.files[mediaFiles[mi]].async('base64');
                  var imgExt = mediaFiles[mi].split('.').pop().toLowerCase();
                  var imgMime = imgExt === 'png' ? 'image/png' : imgExt === 'gif' ? 'image/gif' : 'image/jpeg';
                  var rawUrl = 'data:' + imgMime + ';base64,' + imgBase64;
                  // Compress to 300px max, JPEG quality 0.7
                  var compressed = await compressImage(rawUrl, 300, 0.7);
                  allMediaImages.push(compressed);
                }
                console.log('[Excel导入] 找到并压缩媒体文件:', allMediaImages.length, '张');

                // Try to parse drawing XML for row mapping
                var drawingFiles = Object.keys(zip.files).filter(function(f) {
                  return f.match(/xl\/drawings\/drawing\d+\.xml/) && !zip.files[f].dir;
                });
                console.log('[Excel导入] Drawing文件:', drawingFiles.length, '个');

                if (drawingFiles.length > 0) {
                  // Parse relationship files
                  var relFiles = Object.keys(zip.files).filter(function(f) {
                    return f.match(/xl\/drawings\/_rels\/drawing\d+\.xml\.rels/) && !zip.files[f].dir;
                  });

                  var rIdToFile = {};
                  for (var ri = 0; ri < relFiles.length; ri++) {
                    var relXml = await zip.files[relFiles[ri]].async('string');
                    var relMatches = relXml.match(/Id="rId\d+"[^>]*Target="[^"]+"/g) || [];
                    relMatches.forEach(function(r) {
                      var m = r.match(/Id="(rId\d+)"[^>]*Target="([^"]+)"/);
                      if (m) rIdToFile[m[1]] = m[2];
                    });
                  }
                  console.log('[Excel导入] 关系映射:', Object.keys(rIdToFile).length, '个');

                  // Parse drawing XML with flexible anchor matching
                  for (var di = 0; di < drawingFiles.length; di++) {
                    var dXml = await zip.files[drawingFiles[di]].async('string');
                    console.log('[Excel导入] Drawing XML长度:', dXml.length);

                    // Match all anchor types: twoCellAnchor, oneCellAnchor
                    var anchorRegex = /<(xdr:twoCellAnchor|xdr:oneCellAnchor)[^>]*>([\s\S]*?)<\/\1>/g;
                    var anchorMatch;
                    while ((anchorMatch = anchorRegex.exec(dXml)) !== null) {
                      var content = anchorMatch[2];
                      var rowMatch = content.match(/<xdr:row>(\d+)<\/xdr:row>/);
                      var blipMatch = content.match(/r:embed="(rId\d+)"/);
                      if (rowMatch && blipMatch) {
                        var rowNum = parseInt(rowMatch[1]);
                        var rId = blipMatch[1];
                        var fileRef = rIdToFile[rId];
                        if (fileRef) {
                          var mediaFile = 'xl/' + fileRef.replace('../', '');
                          var mediaIdx = mediaFiles.indexOf(mediaFile);
                          if (mediaIdx >= 0) {
                            rowImages[rowNum] = allMediaImages[mediaIdx];
                          }
                        }
                      }
                    }

                    // Also try simple split approach as fallback
                    if (Object.keys(rowImages).length === 0) {
                      var parts = dXml.split(/<xdr:(twoCellAnchor|oneCellAnchor)/);
                      for (var pi = 1; pi < parts.length; pi++) {
                        var rMatch = parts[pi].match(/<xdr:row>(\d+)<\/xdr:row>/);
                        var bMatch = parts[pi].match(/r:embed="(rId\d+)"/);
                        if (rMatch && bMatch) {
                          var rNum = parseInt(rMatch[1]);
                          var rId2 = bMatch[1];
                          var fRef = rIdToFile[rId2];
                          if (fRef) {
                            var mFile = 'xl/' + fRef.replace('../', '');
                            var mIdx = mediaFiles.indexOf(mFile);
                            if (mIdx >= 0) {
                              rowImages[rNum] = allMediaImages[mIdx];
                            }
                          }
                        }
                      }
                    }
                  }
                  console.log('[Excel导入] Drawing行映射图片:', Object.keys(rowImages).length, '张');
                }

                // WPS cellimages: parse DISPIMG formulas (used by WPS Office)
                if (Object.keys(rowImages).length === 0 && zip.files['xl/cellimages.xml']) {
                  console.log('[Excel导入] 检测到WPS cellimages，解析中...');
                  try {
                    // 1. Parse cellimages.xml for ID -> rId
                    var cellXml = await zip.files['xl/cellimages.xml'].async('string');
                    var idToRId = {};
                    var cellBlocks = cellXml.split(/<etc:cellImage>/);
                    for (var ci = 1; ci < cellBlocks.length; ci++) {
                      var nm = cellBlocks[ci].match(/name="(ID_[^"]+)"/);
                      var em = cellBlocks[ci].match(/r:embed="(rId\d+)"/);
                      if (nm && em) idToRId[nm[1]] = em[1];
                    }

                    // 2. Parse rels for rId -> image filename
                    var cellRelsXml = await zip.files['xl/_rels/cellimages.xml.rels'].async('string');
                    var cellRIdToFile = {};
                    var cellRelMatches = cellRelsXml.match(/Id="rId\d+"[^>]*Target="[^"]+"/g) || [];
                    cellRelMatches.forEach(function(r) {
                      var m = r.match(/Id="(rId\d+)"[^>]*Target="([^"]+)"/);
                      if (m) cellRIdToFile[m[1]] = m[2].replace('media/', '');
                    });

                    // 3. Build filename -> image data lookup
                    var fNameToImg = {};
                    for (var cfi = 0; cfi < mediaFiles.length; cfi++) {
                      fNameToImg[mediaFiles[cfi].split('/').pop()] = allMediaImages[cfi];
                    }

                    // 4. Match rows with DISPIMG formulas
                    var dispimgCount = 0;
                    for (var dr = 1; dr <= range.e.r; dr++) {
                      var dCell = sheet[XLSX.utils.encode_cell({ r: dr, c: colMap.image !== undefined ? colMap.image : 7 })];
                      var formula = dCell && (dCell.f || (dCell.v && String(dCell.v).indexOf('DISPIMG') !== -1 ? String(dCell.v) : ''));
                      if (!formula && dCell && dCell.v) formula = String(dCell.v);
                      if (formula && formula.indexOf('DISPIMG') !== -1) {
                        var idMatch = formula.match(/"(ID_[^"]+)"/);
                        if (idMatch) {
                          var dispId = idMatch[1];
                          var dispRId = idToRId[dispId];
                          var dispFile = dispRId ? cellRIdToFile[dispRId] : null;
                          if (dispFile && fNameToImg[dispFile]) {
                            rowImages[dr] = fNameToImg[dispFile];
                            dispimgCount++;
                          }
                        }
                      }
                    }
                    console.log('[Excel导入] WPS DISPIMG匹配:', dispimgCount, '张');
                  } catch (cellErr) {
                    console.log('[Excel导入] WPS cellimages解析出错:', cellErr.message);
                  }
                }

                // Fallback: if no drawing XML or no matches, use model-to-image mapping
                if (Object.keys(rowImages).length === 0 && allMediaImages.length > 0) {
                  // Build filename -> image data lookup
                  var fileNameToImage = {};
                  for (var fi = 0; fi < mediaFiles.length; fi++) {
                    var fName = mediaFiles[fi].split('/').pop(); // e.g. "image1.jpeg"
                    fileNameToImage[fName] = allMediaImages[fi];
                  }

                  if (typeof IMAGE_FILE_MAP !== 'undefined') {
                    console.log('[Excel导入] 使用型号→图片文件映射匹配...');
                    for (var sr = 1; sr <= range.e.r; sr++) {
                      var mCell = sheet[XLSX.utils.encode_cell({ r: sr, c: colMap.model })];
                      if (mCell && mCell.v && /^[A-Za-z0-9]/.test(String(mCell.v).trim())) {
                        var model = String(mCell.v).trim();
                        var imgFileName = IMAGE_FILE_MAP[model];
                        if (imgFileName && fileNameToImage[imgFileName]) {
                          rowImages[sr] = fileNameToImage[imgFileName];
                        }
                      }
                    }
                    console.log('[Excel导入] 型号匹配:', Object.keys(rowImages).length, '张');
                  } else {
                    // No mapping available, fall back to sequential
                    console.log('[Excel导入] 无映射文件，按顺序匹配...');
                    var imgIdx = 0;
                    for (var sr2 = 1; sr2 <= range.e.r && imgIdx < allMediaImages.length; sr2++) {
                      var mc2 = sheet[XLSX.utils.encode_cell({ r: sr2, c: colMap.model })];
                      if (mc2 && mc2.v && /^[A-Za-z0-9]/.test(String(mc2.v).trim())) {
                        rowImages[sr2] = allMediaImages[imgIdx];
                        imgIdx++;
                      }
                    }
                    console.log('[Excel导入] 顺序匹配:', Object.keys(rowImages).length, '张');
                  }
                }
              } catch (zipErr) {
                console.log('[Excel导入] 图片提取出错:', zipErr.message);
              }

              // 3. Import products
              var products = getProducts();
              var imported = 0, updated = 0;

              for (var r = 1; r <= range.e.r; r++) {
                var modelCell = sheet[XLSX.utils.encode_cell({ r: r, c: colMap.model })];
                if (!modelCell || !modelCell.v) continue;
                var model = String(modelCell.v).trim();
                if (!model || !/^[A-Za-z0-9]/.test(model)) continue;

                var getVal = function(col) {
                  if (col === undefined) return '';
                  var c = sheet[XLSX.utils.encode_cell({ r: r, c: col })];
                  return c && c.v ? String(c.v).trim() : '';
                };

                var rawSeries = getVal(colMap.series);
                var seriesId = seriesNameToId[rawSeries] || SERIES[0].id;
                if (!seriesNameToId[rawSeries]) {
                  for (var key in seriesNameToId) {
                    if (rawSeries.indexOf(key) !== -1 || key.indexOf(rawSeries) !== -1) {
                      seriesId = seriesNameToId[key]; break;
                    }
                  }
                }

                var existing = null;
                for (var pi = 0; pi < products.length; pi++) {
                  if (products[pi].model === model) { existing = products[pi]; break; }
                }

                var imgData = rowImages[r] || (existing ? existing.image : '') || '';

                var productData = {
                  model: model,
                  name: getVal(colMap.name) || model,
                  nameEn: getVal(colMap.nameEn),
                  series: seriesId,
                  parameters: getVal(colMap.params),
                  parametersEn: getVal(colMap.paramsEn),
                  functions: getVal(colMap.functions),
                  image: imgData,
                  images: imgData ? [imgData] : (existing ? (existing.images || []) : [])
                };

                if (existing) {
                  Object.keys(productData).forEach(function(k) {
                    if (productData[k] || k === 'images' || k === 'image') {
                      existing[k] = productData[k];
                    }
                  });
                  updated++;
                } else {
                  productData.id = 'p' + Date.now() + '_' + imported;
                  products.push(productData);
                  imported++;
                }
              }

              saveProducts(products);
              var imgCount = Object.keys(rowImages).length;
              alert('导入完成！新增 ' + imported + ' 个，更新 ' + updated + ' 个产品，提取 ' + imgCount + ' 张图片。');
              renderAdminPanel();
              input.value = '';
            } catch (err) {
              alert('导入失败: ' + err.message);
              console.error(err);
            }
          };
          reader.readAsArrayBuffer(file);
        }

        function exportImageData() {
          var products = getProducts();
          var imageData = {};
          var count = 0;
          for (var i = 0; i < products.length; i++) {
            var p = products[i];
            var img = getProductImage(p);
            if (img && img.length > 100) {
              imageData[p.model] = img;
              count++;
            }
          }
          if (count === 0) {
            alert('没有可导出的图片数据');
            return;
          }
          var js = '// 产品图片数据 - 共 ' + count + ' 个产品\n';
          js += '// 生成时间: ' + new Date().toLocaleString() + '\n';
          js += 'var IMAGE_DATA = ' + JSON.stringify(imageData) + ';\n';

          var token = localStorage.getItem('github_token');
          if (!token) {
            token = prompt('首次使用需要输入 GitHub Personal Access Token（只需输入一次）：\n\n获取方式：GitHub → Settings → Developer settings → Personal access tokens → Generate new token\n权限勾选：repo');
            if (!token) return;
            localStorage.setItem('github_token', token);
          }

          // Get current file SHA (needed for update)
          fetch('https://api.github.com/repos/Mario-lai/product-learning-system/contents/data/images-data.js', {
            headers: { 'Authorization': 'token ' + token }
          })
          .then(function(res) { return res.json(); })
          .then(function(existing) {
            var sha = existing.sha;
            // Update or create file
            return fetch('https://api.github.com/repos/Mario-lai/product-learning-system/contents/data/images-data.js', {
              method: 'PUT',
              headers: {
                'Authorization': 'token ' + token,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                message: '更新产品图片数据 (' + count + ' 个产品)',
                content: btoa(unescape(encodeURIComponent(js))),
                sha: sha
              })
            });
          })
          .then(function(res) {
            if (res.ok) {
              alert('已自动部署到 GitHub！\n\n图片数据已更新，1-2分钟后所有设备即可看到图片。');
            } else if (res.status === 404) {
              // File doesn't exist yet, create it
              return fetch('https://api.github.com/repos/Mario-lai/product-learning-system/contents/data/images-data.js', {
                method: 'PUT',
                headers: {
                  'Authorization': 'token ' + token,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  message: '创建产品图片数据 (' + count + ' 个产品)',
                  content: btoa(unescape(encodeURIComponent(js)))
                })
              }).then(function(r) {
                if (r.ok) {
                  alert('已自动部署到 GitHub！\n\n图片数据已创建，1-2分钟后所有设备即可看到图片。');
                } else {
                  throw new Error('HTTP ' + r.status);
                }
              });
            } else if (res.status === 401) {
              localStorage.removeItem('github_token');
              throw new Error('Token 无效或已过期，请重新输入');
            } else {
              throw new Error('HTTP ' + res.status);
            }
          })
          .catch(function(err) {
            alert('部署失败: ' + err.message + '\n\n已导出到本地，请手动下载。');
            // Fallback: download file
            var blob = new Blob([js], { type: 'application/javascript;charset=utf-8;' });
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'images-data.js';
            link.click();
          });
        }
